name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main

# Permissions required for JamesIves deployment action
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        env:
          CI: false
          REACT_APP_NVIDIA_API_KEY: ${{ secrets.REACT_APP_NVIDIA_API_KEY }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
